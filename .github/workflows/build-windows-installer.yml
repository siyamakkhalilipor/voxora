name: Build Voxora Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install dependencies
        run: npm install

      - name: Build shared packages
        run: |
          npm run build -w @voxora/protocol
          npm run build -w @voxora/permissions

      - name: Typecheck applications
        run: |
          npm run typecheck -w @voxora/server
          npm run typecheck -w @voxora/desktop

      - name: Test
        run: npm test

      - name: Build Voxora installer
        run: npm run tauri:build -w @voxora/desktop -- --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Voxora-Windows-Installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
